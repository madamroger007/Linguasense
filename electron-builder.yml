appId: com.linguasense.app
productName: linguasense
copyright: '2026 Madamroger'
directories:
  buildResources: build
  output: dist

files:
  - out/**
  - resources/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig*.json,CHANGELOG.md,README.md}'

asarUnpack:
  - resources/**

# ---------------- WINDOWS ----------------
win:
  executableName: linguasense
  icon: build/win/icon.ico
  target:
    - target: zip
      arch:
        - x64

# ---------------- LINUX ----------------
linux:
  icon: build/linux/icons
  target:
    - AppImage
  category: Utility

appImage:
  artifactName: ${name}.${ext}

npmRebuild: false

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
